name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Go format check
        run: |
          go install mvdan.cc/gofumpt@latest
          test -z "$(gofumpt -l .)"

      - name: C++ format check
        uses: jidicula/clang-format-action@v4.13
        with:
          clang-format-version: '17'
          check-path: 'client/src'

  build-server:
    name: Build Server
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build -ldflags="-s -w" -o ber-server ./cmd/ber-server/
        working-directory: server

  build-client:
    name: Build Client
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-multimedia-dev cmake ninja-build
      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja
          # Qt6 is expected from aqtinstall or pre-installed
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        working-directory: client
      - name: Build
        run: cmake --build build --config Release
        working-directory: client

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: go test -v -race -count=1 ./...
        working-directory: server
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: server
          fail_ci_if_error: false
