<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ber</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <h1>ber</h1>
  <div class="header-controls">
    <span id="status" class="status-indicator">disconnected</span>
    <input type="text" id="serverAddr" placeholder="localhost:8080" value="localhost:8080">
    <button id="scanBtn" title="Scan library">Scan</button>
  </div>
</header>
<main>
  <aside class="sidebar">
    <h2>Library</h2>
    <ul id="libraryList"></ul>
  </aside>
  <section class="player-section">
    <div id="playerContainer">
      <video id="videoPlayer" controls autoplay></video>
      <div id="emptyState">
        <p>Select a video from the library to start playback</p>
      </div>
    </div>
    <div id="videoInfo" class="video-info"></div>
  </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
